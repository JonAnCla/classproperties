name: Type-check code using alternative type-checkers

"on":
    workflow_dispatch: ~

concurrency:  # yamllint disable-line rule:key-ordering
    cancel-in-progress: true
    group: ${{github.workflow}}-${{github.event.pull_request.number || github.ref}}

permissions:
    contents: read

jobs:
    pyrefly:
        env:
            SKIP_MISSING_DOWNDOC: "True"
            UV_FROZEN: "true"
            UV_NO_SYNC: "true"
            UV_PYTHON_DOWNLOADS: never
        name: Type-check code with Pyrefly
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - uses: actions/checkout@v7
              with:
                persist-credentials: false
                submodules: true

            - name: Set up Python (using matrix version)
              uses: actions/setup-python@v7
              with:
                python-version: ${{matrix.python-version}}

            - name: Install uv (with matrix Python version)
              uses: astral-sh/setup-uv@v10.3.3
              with:
                enable-cache: true
                python-version: ${{matrix.python-version}}

            - name: Install Pyrefly from locked dependencies
              run: uv sync --no-group dev --group alternative-type-checkers --group test

            - name: Run Pyrefly
              run: uv run -- pyrefly check tests.py

    pyright:
        name: Type-check code with Pyright
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - uses: actions/checkout@v7
              with:
                persist-credentials: false
                submodules: true

            - uses: jakebailey/pyright-action@v3
              with:
                python-version: ${{matrix.python-version}}
                extra-args: tests.py
