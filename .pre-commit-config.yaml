default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
    python: python3.15
default_stages: [pre-commit, pre-merge-commit, manual]

repos:
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.13.5
      hooks:
        - id: uv-lock
        - id: uv-audit

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
        - id: gitleaks

    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
        - id: codespell

    - repo: https://github.com/tombi-toml/tombi-pre-commit
      rev: v1.9.0
      hooks:
        - exclude: \A.+\.lock\Z
          id: tombi-format
        - id: tombi-lint
          stages: [manual]

    - repo: https://github.com/tsvikas/sync-with-uv
      rev: v0.6.0
      hooks:
        - id: sync-with-uv

    - repo: https://github.com/kjanat/actionlint
      rev: v1.17
      hooks:
        - id: actionlint-shellcheck
          args: [-pyflakes=]

    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.31.1
      hooks:
        - id: zizmor
          args: [--no-progress, --fix, --persona=auditor]

    - repo: https://github.com/adrienverge/yamllint.git
      rev: v1.38.0
      hooks:
        - id: yamllint
          args: [--strict]

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: 44.176.3
      hooks:
        - id: renovate-config-validator
          args: [--strict]

    - repo: https://github.com/python-jsonschema/check-jsonschema
      rev: 0.38.2
      hooks:
        - id: check-jsonschema
          args: [--schemafile, 'https://json.schemastore.org/yamllint.json']  # yamllint disable-line rule:quoted-strings
          files: ^\.yamllint\.yaml$  # yamllint disable-line rule:key-ordering
          name: Check yamllint configuration file
          types: [yaml]

    - repo: https://github.com/jorisroovers/gitlint
      rev: v0.19.1
      hooks:
        - id: gitlint
        - id: gitlint-ci

    - repo: builtin
      hooks:
        - id: check-added-large-files
        - id: check-case-conflict
        - id: check-executables-have-shebangs
        - id: check-illegal-windows-names
        - id: check-json
        - id: check-jsonc
        - id: check-merge-conflict
        - id: check-shebang-scripts-are-executable
        - id: check-symlinks
        - id: check-toml
        - id: check-vcs-permalinks
        - id: check-xml
        - id: check-yaml
        - id: destroyed-symlinks
        - id: detect-private-key
        - id: end-of-file-fixer
        - id: fix-byte-order-marker
        - id: mixed-line-ending
          args: [--fix=lf]
        - id: pretty-format-json
          args: [--autofix, --indent, "4"]
        - id: require-filename-pattern
          files: (^|/)tests/(?!(?:.+/)?_[a-z_]+/).+\.py$s  # yamllint disable-line rule:key-ordering
          args:
            - ^test_.*\.py$
            - ^__init__\.py$
            - ^conftest\.py$
            - ^_.*\.py$
        - id: trailing-whitespace

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        - id: name-tests-test
          args: [--pytest-test-first]
          files: (?:^|\/)tests\/(?:[^\/]+\/)*(?!_)[^\/]+\.py$  # yamllint disable-line rule:key-ordering

    - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
      rev: v2.16.0
      hooks:
        - id: pretty-format-ini
          args: [--autofix]

    - repo: https://github.com/regebro/pyroma
      rev: 5.0.1
      hooks:
        - id: pyroma
          entry: env SKIP_MISSING_DOWNDOC=True pyroma  # yamllint disable-line rule:key-ordering

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.4
      hooks:
        - id: ruff-check
          args: [--fix]
        - id: ruff-format

    - repo: https://github.com/pycqa/flake8
      rev: 7.5.0
      hooks:
        - id: flake8
          additional_dependencies: [flake8-pyproject, flake8-carrot]  # yamllint disable-line rule:key-ordering

    - repo: https://github.com/google/yamlfmt
      rev: v0.21.0
      hooks:
        - id: yamlfmt
          types: [yaml]
